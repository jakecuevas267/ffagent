[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffagent"
version = "0.1.0"
description = "Human-in-the-loop fantasy football agent for Sleeper and ESPN leagues"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langchain>=0.3",
  "pyyaml>=6",
  "python-dotenv>=1",
  "langgraph-checkpoint-sqlite>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-recording>=0.13", "ruff>=0.6"]

[project.scripts]
ffagent = "ffagent.cli:main"

[tool.setuptools.packages.find]
include = ["ffagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs; opt-in with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
