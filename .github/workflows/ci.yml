name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,keyring,ssm]"
      - run: ruff check ffagent tests
      - run: pytest -q
      - name: demo mode (no credentials)
        env:
          FFAGENT_NO_LLM: "1"
        run: ffagent demo --no-llm > demo.txt && grep -q "AUDIT" demo.txt && tail -5 demo.txt

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ffagent:ci
      - name: demo inside the image
        run: docker run --rm -e FFAGENT_NO_LLM=1 ffagent:ci demo --no-llm | tail -5
